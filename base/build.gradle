apply plugin: 'com.android.application'
apply from: 'emoji-search.gradle'

android {
    compileSdk = 36
    buildFeatures.resValues = true
    packaging.dex.useLegacyPackaging = true
    // Emoji indexes are already gzip-compressed by pack<Variant>EmojiSearch.
    androidResources.noCompress += 'idx'
    defaultConfig {
        applicationId = "io.github.diepet.lettering"
        minSdk = 30
        targetSdk = 36
        versionCode = 17
        versionName = "2.7.0"
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
        resValue "string", "versionName", versionName
        resValue "string", "feedbackUri", "https://github.com/diepet/lettering/issues/new"
        resValue "string", "rateUri", "https://play.google.com/store/apps/details?id=" + applicationId
    }
    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    namespace = 'io.github.diepet.lettering'
    lint {
        abortOnError = true
        checkReleaseBuilds = true
    }
    buildToolsVersion = '36.0.0'
}

dependencies {
    implementation 'androidx.emoji2:emoji2-emojipicker:1.5.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
}
